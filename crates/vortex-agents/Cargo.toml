[package]
name = "vortex-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vortex-types = { workspace = true }
vortex-core = { workspace = true }
vortex-llm = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
libc = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tempfile = { workspace = true }
anyhow = { workspace = true }
chrono-tz = { workspace = true }
# Test-only: virtual-time assertions (start_paused/advance) in tests/autonomy.rs.
# Production builds never enable test-util.
tokio = { workspace = true, features = ["test-util"] }
# Test-only: enables vortex-core's gate override hooks so integration tests
# can force VORTEX_DIAGNOSTICS on/off deterministically. Production builds of
# vortex-agents (and everything else) never enable this feature.
vortex-core = { workspace = true, features = ["diag-test-gate"] }
